<!DOCTYPE html>
<html>

<head>
    <title>DNSentinel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        
        <div>
            <h1>DNSentinel</h1>
            <p class="subtitle">
                ESP32 DNS Sinkhole Dashboard
            </p>
        </div>

        <div class="status">
            <span class="dot"></span>
            Protection Active
        </div>

    </div>

    

    <div class="cards">

        <div class="card">
            <h2>Total Requests</h2>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h2>Blocked Requests</h2>
            <p id="blocked">0</p>
        </div>

        <div class="card">
            <h2>Forwarded Requests</h2>
            <p id="forwarded">0</p>
        </div>

    </div>

    <h2>Recent Queries</h2>

    <table>
        <thead>
            <tr>
                <th>Domain</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="logs">

        </tbody>

    </table>
    <script src="/script.js"></script>
</body>


</html>
