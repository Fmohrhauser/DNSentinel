<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DNSentinel - Queries</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <h2>DNSentinel</h2>
        <a href="/">
            Dashboard
        </a>

        <a href="/queries.html">
            Queries
        </a>

        <a href="/blocklist.html">
            Blocklist
        </a>

        <a href="/settings.html">
            Settings
        </a>
    </div>

    <div class="content">
        
        <div class="header">

            <div>
                <h1>Queries</h1>

                <p class="subtitle">
                    Recent DNS requests
                </p>
            </div>
        </div>
        <input
            type="text"
            id="querySearch"
            placeholder="Search domains...">
        <select id="queryFilter">
            <option value="all">All</option>
            <option value="blocked">Blocked</option>
            <option value="forwarded">Forwarded</option>
            <option value="cache">Cache Hit</option>
        </select>
        <select id="querySort">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">Domain A-Z</option>
            <option value="za">Domain Z-A</option>
        </select>
        <select id="queryLimit">
            <option value="25">25 Queries</option>
            <option value="50">50 Queries</option>
            <option value="100">100 Queries</option>
        </select>
        <button id="clearQueries">
            Clear Log
        </button>
        <p id="queryStatus"></p>
        <h2>Recent Queries</h2>

        <table>

            <thead>

                <tr>
                    <th>Time</th>
                    <th>Domain</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="logs">

            </tbody>
        </table>
        </div>

        <script src="/queries.js"></script>
</body>
</html>
