<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DNSentinel - Queries</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <aside class ="navbar">

        <h2>DNSentinel</h2>
        <nav>
        <a href="/">Dashboard</a>
        <a href="/queries.html" class="active">Queries</a>
        <a href ="/blocklist.html">Blocklist</a>
        <a href="/whitelist.html">Whitelist</a>
        <a href="/settings.html">Settings</a>
    </nav>
    <footer class="navbar-ftr">
            <small>v0.7.0</small>
        </footer>
    </aside>

    <main class="content">

        <header class="topbar">
            <div>

                <h1>Queries</h1>

                <p class="subtitle">
                    Monitor recent DNS requests and filtering actions
                </p>
            </div>

            <div class="topbar-right">
                <div class="status-chip">
                    <span class="live-dot"></span>

                    <span>
                        Live updates
                    </span>
                </div>
            </div>
        </header>



        <section class="card">

            <div class="toolbar">

                <div class="form-group">

                    <label for="querySearch">
                        Search domains
                    </label>

                    <input
                        type="text"
                        id="querySearch"
                        placeholder="example.com"
                        autocomplete="off">
                </div>

                <div class="form-group">

                    <label for="queryFilter">
                        Action
                    </label>

                    <select id="queryFilter">
                        <option value="all">
                            All actions
                        </option>
                        
                        <option value="blocked">
                            Blocked
                        </option>

                        <option value="forwarded">
                            Forwarded
                        </option>

                        <option value="cache">
                            Cache hit
                        </option>
                    </select>
                </div>

                <div class="form-group">

                    <label for="querySort">
                        Sort by
                    </label>

                    <select id="querySort">
                        <option value="newest">
                            Newest First
                        </option>

                        <option value="oldest">
                            Oldest First
                        </option>

                        <option value="az">
                            Domain A-Z
                        </option>

                        <option value="za">
                            Domain Z-A
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="queryLimit">
                        Display
                    </label>

                    <select id="queryLimit">

                        <option value="25">
                            25 Queries
                        </option>

                        <option value="50">
                            50 Queries
                        </option>

                        <option value="100">
                            100 Queries
                        </option>
                    </select>
                </div>

                <div class="form-group form-action">

                    <span class="form-label">
                        Log controls
                    </span>

                    <button 
                        type="button"
                        id="clearQueries"
                        class="danger-btn">

                        Clear Log
                    </button>
                </div>
            </div>
            <p 
                id="queryStatus"
                class="form-status"
                aria-live="polite">
            </p>
        </section>

        <section class="card">

            <header class="card-header">

                <div>

                    <h2>
                        Recent Queries
                    </h2>
                    <p class="table-subtitle">
                        Requests automatically refresh every two seconds
                    </p>
                </div>
            </header>

            <div class="table-scroll">

                <table class="query-table">

                    <thead>

                        <tr>

                            <th scope ="col">
                                Time
                            </th>
                            <th scope="col">
                                Domain
                            </th>
                            <th scope="col">
                                Action
                            </th>
                        </tr>
                    </thead>

                    <tbody id="logs">

                    </tbody>

                </table>

            </div>

        </section>

    </main>
    <script src="/queries.js"></script>
</body>
</html>
