<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DNSentinel - Blocklist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">
        <h2>DNSentinel</h2>

        <a href="/">
            Dashboard
        </a>

        <a href="/queries.html">
            Queries
        </a>

        <a href="/blocklist.html">
            Blocklist
        </a>

        <a href="/settings.html">
            Settings
        </a>
    </div>

    <div class="content">
        <div class="header">
            <div>
                <h1>Blocklist</h1>

                <p class="subtitle">
                    Manage blocked domains
                </p>
            </div>
        </div>
    

        <div class="card blocklist-card">

            <h2>Blocked Domains
                <span id="blocklist-count">(0)</span>
            </h2>
            <input
                id="blocklist-search"
                type="text"
                placeholder="Search domains...">
            <p id="blocklist-results">
                Loading...
            </p>
            <div id="blocklist">
                Loading...
            </div>

            <input
                id="new-domain"
                type="text"
                placeholder="example.com"
            >

            <button id="add-domain">
                Add Domain
            </button>

            <h2> Import Blocklist</h2>

            <p>
                Paste one domain per line.
            </p>

            <textarea
                id="import-list"
                placeholder="doubleclick.net
            ads.google.com
            tracker.com">
        </textarea>

        <br>
        <button id="reset-blocklist">
            Reset Blocklist
        </button>
        <button id="import-button">
            Import Blocklist
        </button>
        <p id="import-progress" class="hidden">
            Importing blocklist. Please wait...
        </p>

        <div id="import-summary" class="summary-card hidden">

            <h3>
                Import Complete
            </h3>


        <p>
            Added:
            <span id="import-added"></span>
        </p>

        <p>
            Duplicates:
            <span id="import-duplicates">0</span>
        </p>

        <p>
            Ignored:
            <span id="import-ignored">0</span>
        </p>

        <button id="close-summary">
            Close
        </button>

        
        </div>
    </div>
    </div>

    <script src="/blocklist.js"></script>
</body>
</html>
